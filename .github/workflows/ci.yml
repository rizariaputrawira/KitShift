name: KitShift CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # setup-node v4
        with:
          node-version: '24'
      - name: Prepare test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          node --version
          rg --no-config --version
      - name: Run regression suite
        run: node --test tests/install-omp.test.mjs tests/install-agy.test.mjs tests/state-helpers.test.mjs tests/search-helper.test.mjs
