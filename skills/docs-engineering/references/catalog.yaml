    "family": "security"
    "canonical-name": "security assurance case"
    "aliases": []
    "purpose": "Link bounded security claims to argument structure, evidence and unresolved assumptions."
    "information-owner": "security-owner"
    "creation-trigger": "Release or system assurance requires a structured security argument."
    "reference": "references/security.md#findings-and-assurance-evidence"
