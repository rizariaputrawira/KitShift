    "family": "security"
    "canonical-name": "security strategy"
    "aliases": []
    "purpose": "Define security governance, scope, review cadence and evidence expectations for an actual system."
    "information-owner": "security-owner"
    "creation-trigger": "Security obligations span owners or releases and are not governed by existing policy."
    "reference": "references/security.md#scope-and-capability-selection"
    "template": "templates/artifact.md"
    "validation-rules":
      - "Identify accountable authority, scope and applicability; do not imply certification."
    "update-triggers":
      - "Threat context, governance or assurance obligations change."
    "AI-use-cases":
      - "Compare provided controls and evidence expectations against stated scope."
    "dependencies": []
  "security-case":
