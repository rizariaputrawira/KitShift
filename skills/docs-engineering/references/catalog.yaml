"artifacts":
  "brief":
    "id": "brief"
    "default-path": "docs/product/brief.md"
    "format": "markdown"
    "family": "product"
    "canonical-name": "brief"
    "aliases": []
    "purpose": "Capture minimal decision-relevant business/user context when an existing product owner is insufficient."
    "information-owner": "product-owner"
    "creation-trigger": "A material business need cannot be understood from existing product sources."
    "reference": "references/requirements.md#business-and-product-inputs"
    "validation-rules":
      - "Verify brief facts against provided sources; no undocumented user or business claims."
    "update-triggers":
      - "Product boundary or decision-relevant facts change."
    "AI-use-cases":
      - "Produce a concise source-cited background summary and list unresolved facts."
    "template": "templates/artifact.md"
    "dependencies": []
  "brd":
    "id": "brd"
    "default-path": "docs/product/brd.md"
    "format": "markdown"
    "family": "product"
    "canonical-name": "business-requirements"
    "aliases":
      - "BRD"
    "purpose": "Record justified business outcomes and constraints without substituting for product/system behavior."
    "information-owner": "product-owner"
    "creation-trigger": "Business stakeholders require a distinct managed business-needs baseline."
    "reference": "references/requirements.md#business-and-product-inputs"
    "validation-rules":
      - "Separate organizational business outcomes from product/system behavior and identify accountable business source."
    "update-triggers":
      - "Business outcome, constraint or stakeholder decision changes."
    "AI-use-cases":
      - "Reconcile supplied business needs and highlight absent owner evidence."
    "template": "templates/artifact.md"
    "dependencies": []
  "prd":
    "id": "prd"
    "default-path": "docs/product/prd.md"
    "format": "markdown"
    "family": "product"
    "canonical-name": "product-requirements"
    "aliases":
      - "PRD"
    "purpose": "Own user/product outcomes, scope, assumptions, constraints, stakeholders and acceptance intent."
    "information-owner": "product-owner"
    "creation-trigger": "Product outcomes need a durable owner beyond existing README/product sources."
    "reference": "references/requirements.md#business-and-product-inputs"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Validate outcome, target audience, scope and success evidence against product owner sources."
    "update-triggers":
      - "Product outcome, scope, assumption or acceptance intent changes."
    "AI-use-cases":
      - "Find conflicting product outcomes and distinguish assumptions from decisions."
    "dependencies": []
  "glossary":
    "id": "glossary"
    "default-path": "docs/product/glossary.md"
    "format": "markdown"
    "family": "product"
    "canonical-name": "glossary"
    "aliases":
      - "GLOSSARY.md"
    "purpose": "Resolve domain terms whose ambiguity affects multiple owners."
    "information-owner": "domain-modeling"
    "creation-trigger": "Material terms are inconsistent or consequentially ambiguous."
    "reference": "references/profiles.md#canonical-concept-owners"
    "validation-rules":
      - "Route consequential term definition through domain-modeling and preserve existing canonical usage."
    "update-triggers":
      - "Domain term or accepted definition changes."
    "AI-use-cases":
      - "Find same-term divergence across relevant owners without imposing a definition."
    "dependencies": []
  "risk-register":
    "id": "risk-register"
    "default-path": "docs/product/risk-register.md"
    "format": "markdown"
    "family": "product"
    "canonical-name": "risk-register"
    "aliases": []
    "purpose": "Track scoped risks, owners, disposition and review triggers when existing risk ownership is insufficient."
    "information-owner": "risk-owner"
    "creation-trigger": "Multiple material risks need explicit cross-document ownership or controlled disposition."
    "reference": "references/security.md#requirements-data-and-trust"
    "validation-rules":
      - "Require risk cause, event, consequence, owner, disposition and review trigger grounded in evidence."
    "update-triggers":
      - "Risk context, evidence, mitigation or disposition changes."
    "AI-use-cases":
      - "Identify risk statements with unsupported impact or no accountable owner."
    "template": "templates/artifact.md"
    "dependencies": []
  "srs":
    "id": "srs"
    "default-path": "docs/requirements/srs.md"
    "format": "markdown"
    "family": "requirements"
    "canonical-name": "system-requirements"
    "aliases":
      - "SRS"
      - "requirements"
    "purpose": "Own formal system behavior, constraints and acceptance boundaries."
    "information-owner": "requirements-owner"
    "creation-trigger": "System behavior needs a durable formal owner beyond existing sources."
    "reference": "references/requirements.md#behavior-and-acceptance"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Check system-level statement source, unambiguous condition and observable acceptance; keep design separate."
    "update-triggers":
      - "System behavior, quality constraint or approved acceptance changes."
    "AI-use-cases":
      - "Detect ambiguity, duplicates and missing behavior branches."
    "dependencies":
      - "brief"
  "stories":
    "id": "stories"
    "default-path": "docs/requirements/user-stories.md"
    "format": "markdown"
    "family": "requirements"
    "canonical-name": "user-stories"
    "aliases": []
    "purpose": "Express user-centered behavior when this format adds distinct acceptance context."
    "information-owner": "product-owner"
    "creation-trigger": "User workflow needs story-level negotiation not captured by canonical requirements."
    "reference": "references/requirements.md#behavior-and-acceptance"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Require actor need and testable story acceptance; do not treat story narrative as approved system requirement."
    "update-triggers":
      - "User workflow or acceptance boundary changes."
    "AI-use-cases":
      - "Identify story acceptance gaps and trace to canonical requirement owner."
    "dependencies":
      - "brief"
  "use-cases":
    "id": "use-cases"
    "default-path": "docs/requirements/use-cases.md"
    "format": "markdown"
    "family": "requirements"
    "canonical-name": "use-cases"
    "aliases": []
    "purpose": "Describe actor/system interaction sequences where scenario complexity needs a dedicated owner."
    "information-owner": "requirements-owner"
    "creation-trigger": "Multi-step actor outcomes cannot be represented clearly in existing requirement sections."
    "reference": "references/requirements.md#behavior-and-acceptance"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Validate actor trigger, alternate/failure path and outcome against system requirements."
    "update-triggers":
      - "Actor, interaction step or failure outcome changes."
    "AI-use-cases":
      - "Enumerate omitted branches from supplied use-case facts."
    "dependencies":
      - "srs"
  "acceptance-criteria":
    "id": "acceptance-criteria"
    "default-path": "docs/requirements/acceptance-criteria.md"
    "format": "markdown"
    "family": "requirements"
    "canonical-name": "acceptance-criteria"
    "aliases": []
    "purpose": "Define observable acceptance boundaries and negative cases for scoped behavior."
    "information-owner": "requirements-owner"
    "creation-trigger": "Existing requirements lack testable acceptance for a material change."
    "reference": "references/requirements.md#behavior-and-acceptance"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Make pass/fail observable with conditions and meaningful boundary values; never invent quantitative targets."
    "update-triggers":
      - "Requirement acceptance or risk boundary changes."
    "AI-use-cases":
      - "Find non-testable acceptance language and missing negative cases."
    "dependencies":
      - "srs"
  "nfr":
    "id": "nfr"
    "default-path": "docs/requirements/nfr.md"
    "format": "markdown"
    "family": "requirements"
    "canonical-name": "quality-requirements"
    "aliases":
      - "NFR"
    "purpose": "Own measurable or explicitly unresolved quality requirements, including security and performance where applicable."
    "information-owner": "requirements-owner"
    "creation-trigger": "Quality constraint warrants an independently maintained owner rather than an SRS section."
    "reference": "references/requirements.md#quality-and-security-acceptance"
    "template": "templates/requirements.md"
    "validation-rules":
      - "State metric, workload, environment and measurement window where known; preserve unresolved target explicitly."
    "update-triggers":
      - "Quality target, workload assumption or measurement method changes."
    "AI-use-cases":
      - "Find quality claims lacking measurable acceptance or provenance."
    "dependencies":
      - "brief"
  "fsd":
    "id": "fsd"
    "default-path": "docs/requirements/fsd.md"
    "format": "markdown"
    "family": "requirements"
    "canonical-name": "functional-specification"
    "aliases":
      - "FSD"
    "purpose": "Preserve organization-specific functional detail only when it has distinct ownership."
    "information-owner": "requirements-owner"
    "creation-trigger": "Existing organizational practice requires a distinct functional specification owner."
    "reference": "references/requirements.md#behavior-and-acceptance"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Follow established organization-specific FSD conventions and cross-link SRS instead of duplicating requirements."
    "update-triggers":
      - "Functional details, organizational convention or linked SRS scope changes."
    "AI-use-cases":
      - "Detect inconsistent functional detail against canonical requirements."
    "dependencies":
      - "srs"
  "traceability-map":
    "id": "traceability-map"
    "default-path": "docs/traceability.yaml"
    "format": "yaml"
    "family": "requirements"
    "canonical-name": "traceability-map"
    "aliases":
      - "traceability"
    "purpose": "Link scoped needs, requirements, design, implementation, verification and evidence."
    "information-owner": "requirements-owner"
    "creation-trigger": "Risk, production, controlled or regulated scope needs explicit trace beyond inline links."
    "reference": "references/traceability.md#map-contract"
    "template": "templates/traceability.yaml"
    "validation-rules":
      - "Check allowed link relations, endpoint kind compatibility, acyclicity and evidence specificity per traceability contract."
    "update-triggers":
      - "Requirement, implementation, test or evidence source/scope changes."
    "AI-use-cases":
      - "Identify forward and reverse trace gaps without fabricating test/evidence nodes."
    "dependencies": []
  "architecture-description":
    "id": "architecture-description"
    "default-path": "docs/architecture/architecture-description.md"
    "format": "markdown"
    "family": "architecture"
    "canonical-name": "architecture-description"
    "aliases": []
    "purpose": "Explain selected stakeholder concerns, boundaries, views, constraints and rationale."
    "information-owner": "architecture-owner"
    "creation-trigger": "Cross-component decisions require a maintained architecture description."
    "reference": "references/architecture.md#architecture-description-and-decisions"
    "template": "templates/architecture.md"
    "validation-rules":
      - "For each selected view state concern addressed, source basis, scope and unknowns; do not infer an unobserved topology."
    "update-triggers":
      - "Stakeholder concern, system boundary, data flow, deployment or integration changes."
    "AI-use-cases":
      - "Compare selected architecture claims with implementation and formal contracts."
    "dependencies":
      - "srs"
  "adr":
    "id": "adr"
    "default-path": "docs/decisions/adr-NNN-<slug>.md"
    "format": "markdown"
    "family": "architecture"
    "canonical-name": "architecture-decision-record"
    "aliases":
      - "ADR"
    "purpose": "Preserve consequential decision context using project domain-modeling conventions."
    "information-owner": "domain-modeling"
    "creation-trigger": "A consequential unresolved or historical tradeoff needs durable rationale."
    "reference": "references/architecture.md#architecture-description-and-decisions"
    "validation-rules":
      - "Follow existing domain-modeling ADR lifecycle and distinguish accepted decisions from proposals."
    "update-triggers":
      - "Decision context, outcome, consequences or supersession changes."
    "AI-use-cases":
      - "Identify undocumented consequential choices and stale decision links."
    "dependencies": []
  "technical-design":
    "id": "technical-design"
    "default-path": "docs/technical/technical-design.md"
    "format": "markdown"
    "family": "technical"
    "canonical-name": "technical-design"
    "aliases":
      - "TSD"
      - "TDD"
      - "SDD"
      - "game technical design"
    "purpose": "Own detailed data, state, sequence, error, dependency, integration and platform implementation design."
    "information-owner": "technical-design-owner"
    "creation-trigger": "Implementation choices affect correctness, interoperability, migration or risk beyond code-local clarity."
    "reference": "references/architecture.md#detailed-technical-design"
    "template": "templates/architecture.md"
    "validation-rules":
      - "Link detailed choice to requirement/architecture and state input-output-error invariants without copying API contract facts."
    "update-triggers":
      - "Data/state/sequence/error/dependency/integration/platform implementation choice changes."
    "AI-use-cases":
      - "Find missing design boundary conditions and contradictions with requirements."
    "dependencies":
      - "architecture-description"
  "openapi":
    "id": "openapi"
    "default-path": "docs/api/openapi.yaml"
    "format": "native"
    "family": "architecture"
    "canonical-name": "OpenAPI contract"
    "aliases":
      - "OpenAPI"
    "purpose": "Own HTTP API operation, schema and protocol facts at the project's chosen version."
    "information-owner": "api-owner"
    "creation-trigger": "HTTP interface consumers require a formal machine-readable contract."
    "reference": "references/web.md#http-contracts"
    "validation-rules":
      - "Preserve OpenAPI version and source contract syntax/operation semantics; do not duplicate schema."
    "update-triggers":
      - "HTTP operation, schema, auth, error or specification version changes."
    "AI-use-cases":
      - "Compare operation contract with requirements; never invent endpoints."
    "dependencies": []
  "asyncapi":
    "id": "asyncapi"
    "default-path": "docs/api/asyncapi.yaml"
    "format": "native"
    "family": "architecture"
    "canonical-name": "AsyncAPI contract"
    "aliases":
      - "AsyncAPI"
    "purpose": "Own event/message interface facts at the project's chosen specification version."
    "information-owner": "api-owner"
    "creation-trigger": "Asynchronous interface consumers require a formal event contract."
    "reference": "references/web.md#event-contracts"
    "validation-rules":
      - "Preserve AsyncAPI version and verify direction, channel, schema and protocol binding from sources."
    "update-triggers":
      - "Message, channel, producer/consumer or protocol binding changes."
    "AI-use-cases":
      - "Find event-contract inconsistency without inferring producer facts from a consumer."
    "dependencies": []
  "api-design-rationale":
    "id": "api-design-rationale"
    "default-path": "docs/api/api-design-rationale.md"
    "format": "markdown"
    "family": "architecture"
    "canonical-name": "API design rationale"
    "aliases":
      - "API design"
    "purpose": "Explain API boundary and tradeoffs without duplicating formal contract facts."
    "information-owner": "api-owner"
    "creation-trigger": "Interface rationale is consequential and absent from contract/ADR owners."
    "reference": "references/web.md#interface-rationale-and-supporting-tools"
    "template": "templates/architecture.md"
    "validation-rules":
      - "Check each rationale against actual consumer/compatibility/security needs, linking formal contract facts."
    "update-triggers":
      - "Interface boundary or consequential API tradeoff changes."
    "AI-use-cases":
      - "Identify missing rationale without recopying schemas."
    "dependencies": []
  "security-requirements":
    "id": "security-requirements"
    "default-path": "docs/security/security-requirements.md"
    "format": "markdown"
    "family": "security"
    "canonical-name": "security-requirements"
    "aliases": []
    "purpose": "State scoped security invariants and acceptance linked to actual assets and trust boundaries."
    "information-owner": "security-owner"
    "creation-trigger": "Security trigger exists and no canonical requirement source captures the invariant."
    "reference": "references/security.md#requirements-data-and-trust"
    "template": "templates/requirements.md"
    "validation-rules":
      - "Require actor, asset, trust invariant, negative acceptance and an explicit verification route."
    "update-triggers":
      - "Security invariant, affected actor/asset or actual obligation changes."
    "AI-use-cases":
      - "Find security requirements with no denial acceptance."
    "dependencies": []
    "phase": 2
  "data-classification":
    "id": "data-classification"
    "default-path": "docs/security/data-classification.md"
    "format": "markdown"
    "family": "security"
    "canonical-name": "data-classification"
    "aliases": []
    "purpose": "Identify actual data sensitivity, flow and ownership with provenance and unknowns."
    "information-owner": "data-owner"
    "creation-trigger": "Data handling or exposure risk requires classification beyond existing owner coverage."
    "reference": "references/security.md#requirements-data-and-trust"
    "template": "templates/threat-model.md"
    "validation-rules":
      - "Inventory actual data purpose/sensitivity/owner/flow/retention with provenance; unknown is explicit."
    "update-triggers":
      - "Data category, collection, owner, flow or retention changes."
    "AI-use-cases":
      - "Identify unclassified flows affecting protection and privacy."
    "dependencies": []
    "phase": 0
  "threat-model":
    "id": "threat-model"
    "default-path": "docs/security/threat-model.md"
    "format": "markdown"
    "family": "security"
    "canonical-name": "threat-model"
    "aliases": []
    "purpose": "Connect assets, flows, trust boundaries, attacker assumptions, threats, controls and residual risk."
    "information-owner": "security-owner"
    "creation-trigger": "Material trust boundary, sensitive data, external exposure or security change needs threat analysis."
    "reference": "references/security.md#threats-architecture-and-controls"
    "template": "templates/threat-model.md"
    "validation-rules":
      - "Map assets, attacker assumptions, boundaries, credible threats, controls and residual-risk verification."
    "update-triggers":
