    "family": "security"
    "canonical-name": "security review evidence"
    "aliases": []
    "purpose": "Record scoped review method, findings, disposition and remediation-specific evidence."
    "information-owner": "security-owner"
    "creation-trigger": "Authorized change review, intake, audit or release assurance requires durable evidence."
    "reference": "references/security.md#findings-and-assurance-evidence"
    "template": "templates/verification.md"
    "validation-rules":
      - "Require scoped source basis, method, coverage, candidate dispositions, actual challenge provenance and any unmet explicit independence requirement."
    "update-triggers":
      - "Review surface, candidate evidence or security finding disposition changes."
    "AI-use-cases":
      - "Separate unvalidated candidates from confirmed vulnerabilities."
    "dependencies": []
  "security-strategy":
    "id": "security-strategy"
    "default-path": "docs/security/security-strategy.md"
